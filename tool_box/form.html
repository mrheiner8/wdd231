    <meta property="og:description"
        content="Smart Tool Box website: Clever Household Tools and Gadgets Directory (A guide to practical, time-saving tools for around the home). HTML, CSS, JavaScript, Json,">
    <meta property="og:image" content="https://mrheiner8.github.io/wdd231/tool_box/images/logo.svg">

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/smaller.css">
    <link rel="stylesheet" href="styles/medium.css">
    <link rel="stylesheet" href="styles/larger.css">

    <link rel="icon" href="favicon.ico">

    <script src="scripts/getdates.js" defer></script>

<body>

    <header>
        <img src="images/logo.svg" alt="SmartToolbox Logo" class="logo">
        <h1>SmartToolbox</h1>
    </header>
    <nav id="nav-bar" class="navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="directory.html">Have a Look In Our Toolbox</a></li>
            <li class="active"><a href="#">Add a Tool to the Box</a></li>
        </ul>
    </nav>
<main>
    <h1>Add a Tool to the Box</h1>
    <div id="join">
        <form method="GET" action="thankyou.html" class="designOne">
            <fieldset>
                <legend>Your Information</legend>
                <label>First Name: <input type="text" name="first" required autocomplete="given-name"
                        title="Your First Name"></label>

                <label>Last Name: <input type="text" name="last" required autocomplete="family-name"
                        title="Your Last Name"></label>

                <label>Email: <input type="email" name="email" required placeholder="john89@gmail.com"
                        title="Your Email" autocomplete="email"></label>

                <label>Mobile Phone Number: <input type="tel" name="phone" required autocomplete="tel"
                        title="A Phone Number with dashes" placeholder="719-555-1234"></label>
            </fieldset>
            <fieldset>
                <legend>Tool Information</legend>
                <label>Name of Tool: <input type="text" name="tool_name" required
                        title="Name of Tool"></label>

                <label>Category: <input type="text" name="category" required title="Category"></label>
        
                <label>Primary Benefit: <textarea name="primaryBenefit" required title="Tool Description"></textarea></label>

                <label>Tool Description: <textarea name="Description" required
                        title="Tool Description"></textarea></label>

                <label>Where to Find This Tool: <input type="text" name="findIt" required title="Where to Find This Tool"></label>

            </fieldset>
            <fieldset>
                <legend>Ease of Use</legend>

                <label><input type="radio" name="ease_of_use" value="very_easy"> Very Easy</label>

                <label><input type="radio" name="ease_of_use" value="easy"> Easy</label>

                <label><input type="radio" name="ease_of_use" value="moderate"> Moderate</label>

                <label><input type="radio" name="ease_of_use" value="difficult" checked> Difficult</label>
            </fieldset>
            <input type="hidden" name="timeStamp" id="timeStamp">

            <input id="submit" type="submit" value="Add Tool">
        </form>
        
    </div>
</main>

    <footer>
        <div>
            <p>© <span id="currentYear"></span> SmartToolBox<br>WDD231 Final Project | Michael Heiner<br>Last
                Modification: <span id="lastModified"></span></p>
        </div>

    </footer>
</body>
