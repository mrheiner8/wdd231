<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <!-- Background -->
  <rect width="420" height="100" rx="10" fill="#F5F5F5"/>
  
  <!-- Classic Metallic Toolbox Icon -->
  <g transform="translate(10, 5)">
    <!-- Top Steel Handle -->
    <path d="M 32 28 V 18 C 32 14, 58 14, 58 18 V 28" fill="none" stroke="#212a31" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 37 15 H 53" fill="none" stroke="#f6d309" stroke-width="5" stroke-linecap="round"/>

    <!-- Main Toolbox Chest -->
    <rect x="12" y="40" width="66" height="42" rx="4" fill="#0707e4"/>
    
    <!-- Heavy Lid Rim -->
    <rect x="10" y="28" width="70" height="14" rx="3" fill="#212a31"/>
    
    <!-- Body Seam Line -->
    <line x1="12" y1="62" x2="78" y2="62" stroke="#212a31" stroke-width="2" opacity="0.3"/>
    
    <!-- Bottom Corner Guards -->
    <path d="M 12 70 V 82 H 24" fill="none" stroke="#212a31" stroke-width="3" stroke-linecap="round"/>
    <path d="M 78 70 V 82 H 66" fill="none" stroke="#212a31" stroke-width="3" stroke-linecap="round"/>

    <!-- Center Yellow Latch -->
    <rect x="38" y="36" width="14" height="16" rx="2" fill="#f6d309"/>
    <rect x="42" y="40" width="6" height="8" rx="1" fill="#212a31"/>

    <!-- Smart Sparkle Accent -->
    <path d="M 76 16 L 78 22 L 84 22 L 79 26 L 81 32 L 76 28 L 71 32 L 73 26 L 68 22 L 74 22 Z" fill="#f6d309"/>
  </g>

  <!-- Brand Text -->
  <text x="110" y="52" font-family="sans-serif" font-weight="900" font-size="34" fill="#0707e4">Smart<tspan fill="#304250">Toolbox</tspan></text>
  <text x="112" y="72" font-family="sans-serif" font-size="11" font-weight="bold" fill="#212a31" letter-spacing="1.5">CLEVER HOUSEHOLD DIRECTORY</text>
</svg>
